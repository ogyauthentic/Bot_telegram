# /etc/nginx/sites-available/pandawa-bot
# Ganti: pandawa.example.com → domain asli kamu
# Ganti: ganti_string_acak_panjang_di_sini → nilai SECRET_PATH di .env

server {
    listen 80;
    server_name pandawa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pandawa.example.com;

    # ── SSL (Let's Encrypt via Certbot) ────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/pandawa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandawa.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Foto bukti transfer bisa sampai beberapa MB
    client_max_body_size 10M;

    # ── Health check ───────────────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:5000/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Webhook Telegram ───────────────────────────────────────────────────
    # Whitelist IP Telegram (opsional tapi direkomendasikan)
    # https://core.telegram.org/bots/webhooks#the-short-version
    location /ganti_string_acak_panjang_di_sini {
        # allow 149.154.160.0/20;
        # allow 91.108.4.0/22;
        # deny all;

        proxy_pass         http://127.0.0.1:5000/ganti_string_acak_panjang_di_sini;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Blokir semua akses lain
    location / {
        return 444;
    }

    access_log /var/log/nginx/pandawa-bot.access.log;
    error_log  /var/log/nginx/pandawa-bot.error.log;
}
